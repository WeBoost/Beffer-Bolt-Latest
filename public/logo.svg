<svg width="160" height="48" viewBox="0 0 160 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes boxFade {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    .box { animation: boxFade 4s infinite; }
    .box:nth-child(2) { animation-delay: 0.5s; }
    .box:nth-child(3) { animation-delay: 1s; }
  </style>
  <rect class="box" x="12" y="12" width="8" height="8" rx="1" fill="#3B82F6"/>
  <rect class="box" x="22" y="12" width="8" height="8" rx="1" fill="#3B82F6"/>
  <rect class="box" x="32" y="12" width="8" height="8" rx="1" fill="#3B82F6"/>
  <text x="48" y="32" fill="#FFFFFF" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" letter-spacing="-0.02em">Beffer</text>
</svg>